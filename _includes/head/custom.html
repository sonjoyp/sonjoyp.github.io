{% include base_path %}

<!-- start custom head snippets -->

<!-- Support for Academicons -->
<link rel="preload" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css"></noscript>

<!-- Support for Font Awesome -->
<link rel="preload" href="{{ base_path }}/assets/css/fontawesome.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="{{ base_path }}/assets/css/fontawesome.css"></noscript>

<!-- Texas A&M favicons. All tab/touch icons point at tamu-icon.png; the stock
     favicon.ico / manifest.json / safari-pinned-tab.svg / browserconfig.xml are
     deliberately not referenced (they carry Minimal Mistakes branding and point
     at icon sizes that don't exist in this repo). Bump ?v= to bust icon caches. -->
<link rel="icon" type="image/png" href="{{ base_path }}/images/tamu-icon.png?v=tamu2">
<link rel="shortcut icon" type="image/png" href="{{ base_path }}/images/tamu-icon.png?v=tamu2">
<link rel="apple-touch-icon" href="{{ base_path }}/images/tamu-icon.png?v=tamu2">
<meta name="msapplication-TileColor" content="#500000">
<meta name="theme-color" content="#faf8f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e1a1a" media="(prefers-color-scheme: dark)">

<!-- end custom head snippets -->
